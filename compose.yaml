services:
    app:
        build: .
        image: my-app:v1
        container_name: my-app
        ports:
         - "127.0.0.1:${HOST_PORT:-8080}:${PORT:-8000}"
        environment:
            PORT: ${PORT:-8000}
            GREETING: ${GREETING:-Hello!}
            STORAGE: sqlite
            DATA_FILE: /data/counter.db
        volumes:
         - my-data:/data
volumes:
    my-data: