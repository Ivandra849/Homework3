services:
    app:
        build: .
        image: my-app:v1
        ports:
         - "127.0.0.1:${HOST_PORT:-8080}:${PORT:-8000}"
        environment:
            PORT: ${PORT:-8000}
            GREETING: ${GREETING:-Hello!}
            STORAGE: redis
            REDIS_URL: redis://redis:6379/0
        depends_on:
            redis:
                condition: service_healthy
        healthcheck:
            test:
              - CMD
              - python 
              - -c
              - "import os, urllib.request;
              urllib.request.urlopen('http://127.0.0.1:' + os.getenv('PORT', '8000') + '/healthz')"
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
    redis:
        image: redis:7.4-alpine
        command: ["redis-server", "--appendonly", "yes"]
        volumes:
          - redis-data:/data
        healthcheck:
            test:
              - CMD
              - redis-cli 
              - ping
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s
volumes:
    redis-data: